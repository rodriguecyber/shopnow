apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: shopnow
  labels:
    app: shop-now
    type: frontend

spec:
  template:
    metadata:
      name: frontend-pod
      labels:
        app: shop-now
        type: frontend

    spec: 
      containers:
        - name: frontend-container
          image: ${FRONTEND_IMAGE}
          env:
           - name: NODE_ENV
             value: production
           - name: NEXT_PUBLIC_API_URL
             value: http://shopnow-backend/api
           - name: API_URL
             value: http://shopnow-backend/api
  replicas: 1
  selector:
    matchLabels:
      app: shop-now
      type: frontend
