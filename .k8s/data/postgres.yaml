apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: shopnow
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      type: database
  template:
    metadata:
      labels:
        app: postgres
        type: database
    spec:
      containers:
       - name: postgres
         image: postgres:15
         ports:
          - containerPort: 5432
         env:
          - name: POSTGRES_DB
            value: shopnow
          - name: POSTGRES_USER
            value: shopnow_user
          - name: POSTGRES_PASSWORD
            value: shopnow_password

      
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: shopnow
spec:
  # The selector must match the labels in the Pod template above
  selector:
    app: postgres
    type: database
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  