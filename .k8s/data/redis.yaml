apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: shopnow
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      type: cache
  template:
    metadata:
      labels:
        app: redis
        type: cache
    spec:
      containers:
      - name: redis
        image: redis:7
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: shopnow
spec:
  # The selector must match the labels in the Pod template above
  selector:
    app: redis
    type: cache
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
